<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VISION — Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
  .wrap{min-height:100%;display:grid;place-items:center;padding:24px}
  .card{max-width:420px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:32px 24px;background:#0b0b0c}
  .logo{width:40px;height:40px;margin:0 auto 16px;background:#fff;color:#000;border-radius:12px;display:grid;place-items:center;font-weight:700;letter-spacing:.08em}
  h1{font-size:18px;font-weight:600;letter-spacing:-.02em}
  p{font-size:13px;color:#9a9a9a;margin-top:8px;line-height:1.5}
  a{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:999px;background:#fff;color:#000;text-decoration:none;font-size:13px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">V</div>
    <h1>You're offline</h1>
    <p>VISION needs an internet connection to talk to the AI. Your previous conversations may still be available. Check your connection and try again.</p>
    <a href="/">Reload VISION</a>
  </div>
</div>
</body>
</html>
